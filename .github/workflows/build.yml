name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ASimpleCalendar.sln

      - name: Test
        shell: bash
        continue-on-error: true
        run: |
          echo "::error::TEST_START"
          dotnet test ASimpleCalendar.Tests/ASimpleCalendar.Tests.csproj -c Release --no-restore
          echo "::error::TEST_END_EXIT=$?"

      - name: Publish (win-x64, self-contained)
        shell: bash
        run: |
          dotnet publish ASimpleCalendar/ASimpleCalendar.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish
          echo "::error::PUBLISH_EXIT_CODE=$?"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASimpleCalendar-win-x64
          path: publish/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ASimpleCalendar-win-x64
          path: publish

      - name: Zip artifact
        run: |
          cd publish
          zip -r ../ASimpleCalendar-win-x64.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ASimpleCalendar ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ASimpleCalendar-win-x64.zip
          generate_release_notes: true
